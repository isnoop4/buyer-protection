<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Protection — AI E-Commerce Claim Reviewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#070b1e;color:#fff;overflow-x:hidden;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 300px at 10% 10%,#7c3aed55,transparent),radial-gradient(600px 300px at 90% 20%,#06b6d455,transparent),radial-gradient(600px 400px at 50% 100%,#f59e0b33,transparent)}
header{max-width:1100px;margin:auto;padding:28px 20px 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:22px;font-weight:900;letter-spacing:.5px}
.logo span{color:#a78bfa}
.badge{background:#ffffff1a;border:1px solid #ffffff33;padding:7px 12px;border-radius:999px;font-size:12px;backdrop-filter:blur(10px)}
.hero{max-width:1100px;margin:auto;padding:26px 20px;text-align:center;animation:fadeUp .7s ease both}
.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.05;font-weight:900}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#a78bfa,#22d3ee,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.hero p{margin:16px auto 0;max-width:700px;color:#cbd5e1;line-height:1.6}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.grid{max-width:1100px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:20px;padding:20px;backdrop-filter:blur(14px);box-shadow:0 20px 50px #00000055;animation:fadeUp .7s ease both}
.card h2{font-size:18px;margin-bottom:6px}
.card p{font-size:13px;color:#cbd5e1;line-height:1.5}
label{display:block;font-size:12px;margin:14px 0 6px;color:#e2e8f0;font-weight:700;letter-spacing:.3px}
input,textarea,select{width:100%;background:#0b122e;border:1px solid #ffffff2a;color:#fff;padding:12px 13px;border-radius:12px;outline:none;font-size:14px}
input:focus,textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #a78bfa33}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;border:0;padding:13px;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px;transition:.2s}
.btn-primary{background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 25px #7c3aed66}
.btn-dark{background:#fff;color:#111}
.btn-ghost{background:transparent;border:1px solid #ffffff44;color:#fff}
.pill{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}
.ok{background:#22c55e33;color:#7CFFB2;border:1px solid #22c55e66}
.warn{background:#f59e0b33;color:#fde68a;border:1px solid #f59e0b66}
.demo{cursor:pointer;transition:.2s}
.demo:hover{transform:translateY(-3px) scale(1.01)}
.demo.active{border-color:#a78bfa;box-shadow:0 0 0 3px #a78bfa44}
.result{margin-top:14px;background:#020617;border-radius:14px;padding:14px;font-family:monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;min-height:88px;border:1px solid #ffffff1f}
.thinking{display:none;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:#a5f3fc}
.dot{width:8px;height:8px;border-radius:50%;background:#22d3ee;animation:blink 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:640px){.steps{grid-template-columns:1fr 1fr}}
.step{background:#ffffff0f;border:1px solid #ffffff1f;border-radius:14px;padding:12px;text-align:center;animation:float 4s ease-in-out infinite}
.step b{font-size:22px}
.step span{display:block;font-size:12px;color:#cbd5e1;margin-top:4px}
footer{max-width:1100px;margin:18px auto 30px;padding:0 20px;color:#94a3b8;font-size:12px;text-align:center;line-height:1.6}
a{color:#a5f3fc}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="logo">🛡️ Buyer<span>Protection</span></div>
  <div class="badge">✦ GenLayer • Intelligent Contract • Test
